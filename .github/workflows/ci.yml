name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: |
            _site/img
            _site/og
          key: images-${{ hashFiles('src/images/**', 'config/images.js') }}
      - run: npm run lint
      - run: npm run validate
      - run: npm run test:coverage
      - name: Build (production)
        run: npm run build
        env:
          ELEVENTY_ENV: production
      - run: npm run test:build
      - name: Lighthouse (performance, accessibility, best practices, SEO)
        run: npx --yes @lhci/cli@0.15.1 autorun
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            playwright-report/
            lighthouse-report/
          retention-days: 7

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            _site/img
            _site/og
          key: images-${{ hashFiles('src/images/**', 'config/images.js') }}
      - run: npm run build
        env:
          ELEVENTY_ENV: production
      - name: Upload preview version
        id: upload
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" | tee upload.log
          echo "url=$(grep -oE 'https://pr-[^ ]+workers\.dev' upload.log | head -1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview URL
        if: steps.upload.outputs.url != ''
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body "Preview: ${{ steps.upload.outputs.url }}" \
            || gh pr comment "${{ github.event.pull_request.number }}" --body "Preview: ${{ steps.upload.outputs.url }}"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            _site/img
            _site/og
          key: images-${{ hashFiles('src/images/**', 'config/images.js') }}
      - run: npm run build
        env:
          ELEVENTY_ENV: production
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
